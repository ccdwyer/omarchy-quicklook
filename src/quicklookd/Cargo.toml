[package]
name = "quicklookd"
version = "1.0.0"
edition = "2021"
description = "QuickLook helper: fuzzy search, isolated previews, frecency"
license = "MIT"
publish = false

[lib]
name = "quicklookd"
path = "src/lib.rs"

[[bin]]
name = "quicklookd"
path = "src/main.rs"

[dependencies]
csv = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
infer = "0.19"
libc = "0.2"
nucleo-matcher = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "plist-load", "dump-load", "regex-onig"] }
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
